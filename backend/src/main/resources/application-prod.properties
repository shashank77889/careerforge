# Explicit production configuration; supply values through your secret manager/environment.
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
# Create only the new Job Match table before Hibernate validates the schema.
# For externally managed migrations, apply this script first and set SQL_INIT_MODE=never.
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/2026-09-job-match.sql,classpath:db/2026-09-password-recovery.sql
spring.sql.init.continue-on-error=false
careerforge.jwt.secret=${JWT_SECRET}
careerforge.cors.origins=${FRONTEND_ORIGIN}
server.error.include-message=never
server.error.include-stacktrace=never
