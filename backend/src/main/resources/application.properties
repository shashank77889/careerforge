spring.application.name=CareerForge
server.port=${PORT:8080}

spring.config.import=optional:file:.local/application-local.properties
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/careerforge}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Optional generative career coach. Keep secrets on the server only.
careerforge.ai.api-key=${OPENAI_API_KEY:}
careerforge.ai.model=${OPENAI_MODEL:}

careerforge.jwt.secret=${JWT_SECRET:}

# Email recovery is opt-in; secrets belong in environment variables.
careerforge.recovery.enabled=${PASSWORD_RESET_ENABLED:false}
careerforge.recovery.from=${MAIL_FROM:}
careerforge.recovery.frontend-url=${PASSWORD_RESET_FRONTEND_URL:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# HTTPS email delivery works on hosts that block SMTP.
careerforge.recovery.brevo-api-key=${BREVO_API_KEY:}
